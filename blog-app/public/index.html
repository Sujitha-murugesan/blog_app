<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlogApp - Home</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Latest Blogs</h1>
    <div id="blogs"><div class="card empty">Loading…</div></div>
  </main>
  <script src="/js/api.js"></script>
  <script>
    (async () => {
      const box = document.getElementById('blogs');
      try {
        const blogs = await api('/blogs');
        if (!blogs.length) {
          box.innerHTML = '<div class="card empty">No blogs yet. Be the first to <a href="/create-blog.html">write one</a>!</div>';
          return;
        }
        box.innerHTML = blogs.map(b => `
          <article class="card blog">
            <h2>${escapeHtml(b.title)}</h2>
            <div class="meta">by ${escapeHtml(b.authorName)} · ${new Date(b.createdAt).toLocaleString()}</div>
            <p>${escapeHtml(b.content)}</p>
          </article>`).join('');
      } catch (e) {
        box.innerHTML = `<div class="card msg error">${escapeHtml(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
